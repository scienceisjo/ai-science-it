function field(k,label,hint='',rows=3){answerLabels[k]=label;return `<label class="field">${label}<small>${hint}</small><textarea data-answer="${k}" rows="${rows}" maxlength="5000">${esc(S.answers[k]||'')}</textarea></label>`}
function select(key,arr,val){return `<select data-setting="${key}">${arr.map(x=>{const [v,t]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}" ${String(val)===String(v)?'selected':''}>${esc(t)}</option>`}).join('')}</select>`}
function brief(title,text){return `<div class="task-brief"><strong>${title}</strong><p>${text}</p></div>`}
function source(text,url,unit,year,updated=D?.version){return `<div class="source">출처: <a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)} <i data-lucide="external-link" style="width:10px;height:10px"></i></a><br>단위 ${esc(unit)} · 기준 ${esc(year)} · 자료 확인 ${esc(updated)}</div>`}
function cloze(t){return `<button class="cloze" data-reveal="${esc(t)}">${'□'.repeat(Math.min(t.length,5))}</button>`}
function chart(series,unit,{bars=false}={}){const W=580,H=228,L=64,R=15,T=25,B=35;let vals=series.flatMap(s=>s.points.map(p=>p.y)).filter(Number.isFinite),max=Math.max(...vals,1)*1.14;const labelsX=series[0]?.points.map(p=>p.x)||[];let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(unit)} 자료 그래프"><text x="12" y="15" fill="#55676b" font-size="10">${esc(unit)}</text>`;
 for(let i=0;i<=4;i++){let y=H-B-(H-T-B)*i/4;svg+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#dce6e5"/><text x="${L-7}" y="${y+4}" text-anchor="end" font-size="10" fill="#5d6d70">${fmt(max*i/4,max>100?0:1)}</text>`}
 const xMin=Math.min(...labelsX.map(Number)),xMax=Math.max(...labelsX.map(Number));
 series.forEach((s,si)=>{const pts=s.points.filter(p=>p.y!==null&&Number.isFinite(p.y));const xAt=(p,i)=>bars?L+(i+.5)*(W-L-R)/s.points.length:typeof p.x==='number'?L+(p.x-xMin)/(xMax-xMin||1)*(W-L-R):L+i/Math.max(s.points.length-1,1)*(W-L-R);const yAt=p=>H-B-p.y/max*(H-T-B);if(!bars)svg+=`<polyline fill="none" stroke="${s.color||colors[si]}" stroke-width="3" points="${pts.map((p,i)=>xAt(p,i)+','+yAt(p)).join(' ')}"/>`;
 pts.forEach((p,i)=>{const x=xAt(p,i),y=yAt(p),col=s.color||colors[si];if(bars){const bw=(W-L-R)/s.points.length/(series.length+1);svg+=`<rect x="${x+(si-series.length/2)*bw}" y="${y}" width="${bw*.85}" height="${H-B-y}" fill="${col}" rx="2"><title>${esc(s.name)} ${esc(p.x)}: ${fmt(p.y)} ${esc(unit)}</title></rect>`}else svg+=`<circle cx="${x}" cy="${y}" r="${pts.length>20?2:4}" fill="${col}"><title>${esc(s.name)} ${esc(p.x)}: ${fmt(p.y)} ${esc(unit)}</title></circle>`;if(si===0&&(pts.length<=8||i===0||i===pts.length-1||i%Math.ceil(pts.length/5)===0))svg+=`<text x="${x}" y="${H-11}" text-anchor="middle" font-size="10" fill="#5d6d70">${esc(p.x)}</text>`})});svg+='</svg>';return svg+`<div class="legend">${series.map((s,i)=>`<span><i style="background:${s.color||colors[i]}"></i>${esc(s.name)}</span>`).join('')}</div>`}
function point(label,value,unit,year,src,kind='실제 자료'){const i=selectedPoints.push({label,value,unit,year,source:src,kind,lesson:S.lesson+1,selection:{country:S.country,city:S.city,metric:S.metric,day:S.day,capacity:S.capacity,efficiency:S.efficiency}})-1;return `<div class="value"><small>${esc(label)} · ${esc(year)}</small><strong>${fmt(value)}</strong><small>${esc(unit)} · ${esc(kind)}</small><br><button data-pin="${i}"><i data-lucide="bookmark-plus"></i> 근거 담기</button></div>`}
function evidenceList(arr=S.evidence){return arr.length?arr.map(e=>`<article class="evidence"><small>${esc(e.id)} · ${e.lesson}차시 · ${esc(e.kind)}</small><p><b>${esc(e.label)}</b> · ${fmt(e.value)} ${esc(e.unit)} (${esc(e.year)})</p><small>${esc(e.source)}</small></article>`).join(''):'<p class="empty">아직 담은 근거가 없습니다. 자료의 수치를 확인하고 근거 담기를 선택하세요.</p>'}
function co2View(){const rows=D.countries[S.country].co2.filter(r=>r.co2!==null&&r.year>=S.start&&r.year<=S.end);const years=D.countries[S.country].co2.filter(r=>r.co2!==null).map(r=>r.year);const u='https://ourworldindata.org/grapher/annual-co2-emissions-per-country';return brief('서로 다른 두 연도의 수치를 담으세요','나라와 기간을 바꾸어 증가폭과 변화 구간을 찾고, 설명을 먼저 남기세요.')+`<div class="filters"><label>대상${select('country',Object.entries(names),S.country)}</label><label>시작 연도${select('start',years,S.start)}</label><label>끝 연도${select('end',years,S.end)}</label></div>`+chart([{name:names[S.country],points:rows.map(r=>({x:r.year,y:r.co2}))}],'백만 tCO₂/년')+source('OWID / Global Carbon Budget',u,'백만 tCO₂/년',`${S.start}–${S.end}`)+`<div class="values">${rows.length?[rows[0],rows.at(-1)].map(r=>point(names[S.country]+' 연간 CO₂',r.co2,'백만 tCO₂/년',r.year,u)).join(''):''}</div>`+field('l1pattern','어떤 변화가 눈에 들어왔나요?','두 연도와 수치를 포함해 변화 구간을 설명하세요.')+`<div class="note myth">이 자료는 주로 화석연료·산업 CO₂입니다. 모든 온실가스나 토지이용 배출의 합계가 아닙니다. 함께 변했다는 사실만으로 원인을 확정할 수 없습니다.</div>`}
const METRICS={fossil_share_energy:['화석연료 / 1차에너지','%'],low_carbon_share_energy:['저탄소 / 1차에너지','%'],renewables_share_energy:['재생 / 1차에너지','%'],low_carbon_share_elec:['저탄소 / 발전량','%'],renewables_share_elec:['재생 / 발전량','%'],carbon_intensity_elec:['전력 탄소집약도','gCO₂e/kWh']};
function energyView(compare=false){const years=[2000,2010,2020,2023,2024];const [label,unit]=METRICS[S.metric];const url=S.metric.includes('elec')?'https://ourworldindata.org/grapher/carbon-intensity-electricity':'https://ourworldindata.org/energy-mix';const rows=Object.keys(names).map(c=>({c,row:D.countries[c].energy.find(r=>r.year===+S.year)}));let html=brief(compare?'두 종류의 지표로 판단을 점검하세요':'비율과 사용량을 함께 확인하세요',compare?'재생에너지 비율만으로 탄소집약도를 판단할 수 있을까요? 지표를 바꿔 근거를 담으세요.':'저탄소 에너지는 재생에너지와 원자력을 포함합니다. 1차에너지와 전력의 분모를 구분하세요.')+`<div class="filters"><label>지표${select('metric',Object.entries(METRICS).map(([k,v])=>[k,v[0]]),S.metric)}</label><label>연도${select('year',years,S.year)}</label></div>`+chart([{name:label,points:rows.map(x=>({x:names[x.c],y:x.row?.[S.metric]??null}))}],unit,{bars:true})+source('OWID Energy Data',url,unit,S.year)+`<div class="values">${rows.filter(x=>x.row?.[S.metric]!=null).map(x=>point(names[x.c]+' '+label,x.row[S.metric],unit,S.year,url)).join('')}</div>`;
 if(!compare){const row=D.countries.World.energy.find(r=>r.year===+S.year);html+=`<details open><summary>세계 에너지원별 사용량도 보기</summary>`+chart([{name:'사용량',points:[['석탄','coal_consumption'],['석유','oil_consumption'],['가스','gas_consumption'],['저탄소','low_carbon_consumption']].map(([x,k])=>({x,y:row?.[k]??null}))}],'TWh/년',{bars:true})+source('OWID, 1차에너지 대체법',url,'TWh/년',S.year)+`</details>`+field('l1energy','비율이 커지면 전체 배출도 반드시 줄어들까요?','총사용량과 에너지원 구성을 연결하여 설명하세요.');}
 else html+=field('l1check','처음 판단을 유지하나요, 수정하나요?','선택한 두 지표와 단위가 어떻게 판단을 바꾸었는지 적으세요.')+`<div class="note myth">전력은 전체 에너지의 일부입니다. 전력 탄소집약도가 낮아도 교통 연료·산업·토지이용 등을 포함한 도시 전체가 넷제로라는 뜻은 아닙니다.</div>`+`<label class="field">검증 연습: “이 그래프만으로 특정 정책이 감소의 유일한 원인임을 확인했다.”${select('literacy1',[['','선택'],['extra','추가 자료 필요'],['direct','직접 확인 가능']],S.literacy1||'')}</label>`;return html}
function cityView(step){const c=CITIES.find(c=>c.id===S.city);let html=`<div class="filters"><label>사례도시${select('city',CITIES.map(x=>[x.id,x.name]),S.city)}</label></div>`;
 if(step===1)html+=brief('도시 안에서 배출량이 어떻게 변했나요?','두 시점의 수치를 담으세요. 다른 도시와 순위를 매기기 전에 산정 범위를 확인하세요.')+chart([{name:c.name,points:c.years.map((x,i)=>({x,y:c.total[i]/1000}))}],'천 tCO₂e/년')+`<div class="values">${[0,c.years.length-1].map(i=>point(c.name+' 총배출',c.total[i],'tCO₂e/년',c.years[i],c.source)).join('')}</div>`+field('l2trend','배출 변화에 대한 설명','수치와 기간을 포함하세요. 정책의 효과인지는 아직 추론입니다.');
 if(step===2)html+=brief('큰 배출 부문과 추가 지표를 연결하세요','총배출 자료와 다른 종류의 지표를 최소 하나 담아 전략을 추론하세요.')+chart([{name:c.name,points:Object.entries(c.sectors).map(([x,y])=>({x,y:y/1000}))}],'천 tCO₂e/년',{bars:true})+`<div class="values">${Object.entries(c.sectors).map(([k,v])=>point(c.name+' '+k,v,'tCO₂e/년',c.sectorYear,c.source)).join('')}</div>`+c.metrics.map(m=>`<div class="band"><h3>${m.name}</h3><div class="values">${m.values.map((v,i)=>point(c.name+' '+m.name,v,m.unit,m.years[i],c.source)).join('')}</div></div>`).join('')+field('l2infer','이 도시가 우선해야 할 정책은 무엇일까요?','총배출과 부문 또는 교통·에너지 지표를 함께 사용하세요.');

 return html+source(c.publication,c.source,'tCO₂e/년 또는 각 지표 표시',c.years.join(', '),c.updated)+`<div class="note">${esc(c.boundary)}</div>`}
function policyText(c){return `<div class="band"><h3>${c.name}의 실제 전략</h3><p class="reading">${c.policy}</p><div class="note myth">${c.target}</div><p class="small">${c.limit}</p></div>`}
function buildingRows(){return D.building.rows.slice(S.day*24,S.day*24+24)}
function buildingCalc(){const rows=buildingRows(),raw=rows.map(r=>r.value),after=raw.map(v=>v*(1-S.efficiency/100)),pv=raw.map((_,h)=>Math.max(0,Math.sin((h-6)/12*Math.PI))*(h>=6&&h<=18?S.capacity:0));const sum=a=>a.reduce((s,v)=>s+v,0);return {raw,after,pv,consumption:sum(after),production:sum(pv),imported:sum(after.map((v,i)=>Math.max(0,v-pv[i]))),exported:sum(after.map((v,i)=>Math.max(0,pv[i]-v)))}}
function buildingView(passive=false){const b=buildingCalc();return brief(passive?'같은 부하에서 효율 조건만 바꾸세요':'낮 한 시점과 하루 전체를 구분하세요',passive?'적용 전후를 비교하고, 실제 측정으로 확인해야 할 조건을 적으세요.':'태양광 용량과 날짜를 바꾸어 하루 수지와 시간대별 수입·수출 전력을 확인하세요.')+`<div class="filters"><label>실측 날짜${select('day',[0,1,2,3,4,5,6].map(i=>[i,D.building.rows[i*24].timestamp.slice(0,10)]),S.day)}</label></div><label class="field"><span class="range-label"><span>가상 태양광 최대 출력</span><b>${S.capacity} kW</b></span><input type="range" min="0" max="150" step="1" data-setting="capacity" value="${S.capacity}"></label><label class="field"><span class="range-label"><span>가정한 전력 수요 감소율</span><b>${S.efficiency}%</b></span><input type="range" min="0" max="50" data-setting="efficiency" value="${S.efficiency}"></label>`+chart([{name:'실측 소비',points:b.raw.map((y,x)=>({x,y})),color:'#a4aaa8'},{name:'가정 적용 후 소비',points:b.after.map((y,x)=>({x,y})),color:colors[0]},{name:'가상 태양광',points:b.pv.map((y,x)=>({x,y})),color:colors[1]}],'kWh / 1시간 구간')+`<div class="values">${point('가정 적용 하루 소비',b.consumption,'kWh/일',buildingRows()[0].timestamp.slice(0,10),D.building.source,'실측 기반 가정')}${point('가상 하루 발전',b.production,'kWh/일',buildingRows()[0].timestamp.slice(0,10),'수업용 사인 곡선 · 실측/PVWatts 아님','교육용 모형')}</div><div class="note">하루 발전−소비: <b>${fmt(b.production-b.consumption)} kWh</b><br>시간별 부족 전력 합: ${fmt(b.imported)} kWh · 잉여 전력 합: ${fmt(b.exported)} kWh<br>저장장치 없음, 1시간 구간의 평균 출력을 에너지로 환산한 단순 모형입니다.</div>`+source('BDG2 / '+D.building.id,D.building.source,'kWh',buildingRows()[0].timestamp.slice(0,10))+`<details><summary>자료와 가정 확인</summary><p>BDG2는 비주거 건물의 정제된 계량 자료입니다. 이 건물을 실제 제로에너지 주택이라고 부르지 않습니다. 발전 곡선은 06–18시 사인 함수의 교육용 가정이며 기상·그늘·인버터 손실을 반영하지 않습니다. 감소율은 검증된 단열 성능이 아닙니다.</p><a href="https://pvwatts.nrel.gov/" target="_blank" rel="noopener">PVWatts에서 실제 위치·용량 조건 탐색</a></details>`+field(passive?'l3passive':'l3balance',passive?'관찰된 차이와 실제로 검증할 조건':'하루 에너지 수지로 무엇을 말할 수 있나요?',passive?'단열·차양의 원리를 설명하고, 기상·재실·설비 조건 중 통제할 것을 적으세요.':'낮의 잉여, 밤의 부족, 일간 수지, 연간 성능을 구분하세요.')+`<div class="note myth">하루 에너지 수지가 0이어도 연간 제로에너지 건축물 인증이나 탄소중립을 뜻하지 않습니다. 수입·수출 전력의 시간과 배출계수가 다를 수 있습니다.</div>`}
function budget(){let out={...BASE},cost=0;for(const p of POLICIES){const v=S.policies[p.id];if(v?.on){cost+=p.cost;if(p.sector)out[p.sector]=BASE[p.sector]*(1-v.rate/100)}}const total=Object.values(out).reduce((a,b)=>a+b,0);return {sectors:out,total,cost,saved:1000-total}}
function budgetView(){const b=budget();return brief('정책 조합 A와 B를 비교하세요','자원 8점 안에서 정책을 선택하고, 정책마다 DATA PASSPORT 근거와 적용 조건을 연결하세요.')+chart([{name:'기준',points:Object.entries(BASE).map(([x,y])=>({x,y}))},{name:'설계 후',points:Object.entries(b.sectors).map(([x,y])=>({x,y}))}],'tCO₂e/년 · 가상도시',{bars:true})+`<div class="values"><div class="value"><small>기준 → 설계 후</small><strong>1,000 → ${fmt(b.total)}</strong><small>tCO₂e/년 · 감축 ${fmt(b.saved/10)}%</small></div><div class="value"><small>사용 자원 / 가상 제약</small><strong style="color:${b.cost>8?'var(--coral)':'var(--green)'}">${b.cost} / 8</strong><small>비용 단위 아님 · 수업용 점수</small></div></div><details><summary>모형의 계산식과 경계</summary><p>다섯 부문 기준 합계 1,000 tCO₂e/년은 가상값입니다. 전력은 건물·교통의 직접 연료 배출과 분리하여 중복 계산하지 않습니다. 각 정책의 가정한 감축률 × 해당 부문 기준 배출량을 차감합니다. 상호작용·반동효과·지역별 배출계수는 포함하지 않습니다. 감축률은 실제 정책 성과가 아닙니다. 녹지 흡수는 근거 없이는 차감하지 않습니다.</p><a href="https://www.epa.gov/climateleadership/ghg-emission-factors-hub" target="_blank" rel="noopener">공인 배출계수 비교 자료</a> · <a href="https://efdb.ipcc-nggip.iges.or.jp/EFDB/main.php" target="_blank" rel="noopener">IPCC 계수 검색</a></details>`+POLICIES.map(p=>{const v=S.policies[p.id]||{on:false,rate:p.base,evidence:'',reason:''};return `<article class="policy"><header><label class="row"><input type="checkbox" data-policy="${p.id}" data-pkey="on" ${v.on?'checked':''}><i data-lucide="${p.icon}"></i><b>${p.name}</b></label><span class="badge">자원 ${p.cost}</span></header><p>${p.why}</p>${v.on?`${p.sector?`<label>해당 부문 감축률 가정: ${v.rate}%<input type="range" min="0" max="${p.max}" value="${v.rate}" data-policy="${p.id}" data-pkey="rate"></label>`:''}<label>연결할 근거<select data-policy="${p.id}" data-pkey="evidence"><option value="">근거 선택</option>${S.evidence.map(e=>`<option value="${esc(e.id)}" ${v.evidence===e.id?'selected':''}>${esc(e.id+' '+e.label+' '+fmt(e.value))}</option>`).join('')}</select></label><label>근거가 이 정책과 연결되는 이유와 조건<textarea data-policy="${p.id}" data-pkey="reason" rows="2">${esc(v.reason)}</textarea></label>`:''}</article>`}).join('')+`<div class="row"><button id="scenario-save"><i data-lucide="git-compare-arrows"></i> 현재 조합 기록</button></div>`+(S.scenarios.length?`<table class="mini-table"><tr><th>조합</th><th>예상 배출</th><th>자원</th><th></th></tr>${S.scenarios.map((s,i)=>`<tr><td>${esc(s.name)}</td><td>${fmt(s.total)} tCO₂e</td><td>${s.cost}</td><td><button data-load-scenario="${i}">불러오기</button></td></tr>`).join('')}</table>`:'')+field('l4tradeoff','최종 조합의 선택 이유와 포기한 것','두 조합의 배출·자원·조건을 비교하고 불확실성을 설명하세요.')}
function getContent(l,s){if(l===0){if(s===0)return brief('먼저 자신의 설명을 남기세요','전환 중 열이 버려진다는 것과 에너지 자체가 사라진다는 것은 같을까요?')+`<div class="reading"><p>에너지가 다른 형태로 바뀌어도 전체 에너지의 양은 ${cloze('보존')}됩니다. 그러나 원하는 일을 하는 데 쓰이지 못하고 주변으로 퍼지는 열이 생기므로 ${cloze('효율')}을 고려해야 합니다.</p><p>화석연료 사용은 CO₂ 배출과 연결됩니다. 전력을 청정하게 생산하는 일과 에너지 수요를 줄이는 일을 함께 살펴봅시다.</p></div>`+field('l1initial','처음 생각: 에너지가 보존되는데 왜 절약해야 할까요?','지금 생각을 먼저 적으세요. 마지막에 수정할 수 있습니다.')+`<div class="note">오늘 남길 것: 자료에서 직접 읽은 수치 2개 이상 + 주장·근거·추론 카드.</div>`;if(s===1)return co2View();if(s===2)return energyView();if(s===3)return energyView(true);return brief('NET ZERO ECO-CITY의 필요성을 근거로 설명하세요','수집한 자료를 검토하고, 주장·근거·추론을 각각 작성하세요.')+evidenceList(S.evidence.filter(e=>e.lesson===1))+field('l1claim','주장 · 어떤 변화가 필요한가?')+field('l1evidence','근거 · 실제 데이터 수치 2개 이상','수치·단위·연도·대상을 적으세요.')+field('l1reason','추론 · 왜 이 근거가 주장을 뒷받침하는가?','전력과 전체 에너지, 효율과 배출을 연결하세요.')+field('l1revision','처음 설명에서 수정한 점');}
 if(l===1){if(s===0)return brief('도시를 고르고 첫 판단을 기록하세요','앞 차시의 필요성을 실제 도시의 해결 전략으로 이어갑니다.')+`<div class="row">${CITIES.map(c=>`<button data-city-open="${c.id}"><i data-lucide="map-pin"></i>${c.name}</button>`).join('')}</div>`+field('l2initial','어느 도시의 어떤 전략이 유망해 보이나요?','아직 확인하지 않은 생각도 적으세요. 다음 단계에서 데이터를 확인합니다.')+`<div class="note myth">도시의 총배출량만으로 친환경 순위를 매기지 않습니다. 인구·기준연도·범위·회계 방식이 다를 수 있습니다.</div>`;if(s<4)return cityView(s);return brief('내 도시에 가져올 전략 하나를 정하세요','각 칸에 데이터와 정책의 관계를 설명하세요.')+field('l2problem','문제 · 선택한 도시의 우선 과제')+field('l2evidence','증거 · 서로 다른 자료 2종 이상','총배출 추이와 교통·건물·에너지 자료를 연결하세요.')+field('l2policy','적용 기술·정책')+field('l2effect','관찰된 변화와 예상 효과','실적과 목표를 구분하고, 원인 단정은 피하세요.')+field('l2limit','한계 · 다른 도시로 가져올 때 필요한 조건')+field('l2transfer','가져올 전략 1개와 데이터 근거')}
 if(l===2){if(s===0)return brief('건물을 둘러보고 기술의 역할을 설명하세요','단열·차양은 수요, 태양광은 공급을 바꿉니다. 건물의 각 부분을 확인하세요.')+`<div class="reading"><p>${cloze('패시브')} 기술은 단열·차양 등으로 냉난방 수요를 줄입니다. 고효율 설비와 제어는 에너지 이용을 개선하고, 태양광은 전기를 생산합니다.</p></div><div class="row"><button id="explode-house"><i data-lucide="layers-3"></i> 외피·태양광 분리</button><button id="view-house"><i data-lucide="box"></i> 건물 자세히 보기</button></div>`+field('l3prediction','어떤 기술이 소비량과 발전량 중 무엇을 바꿀까요?','기술 하나의 원리와 예측을 적으세요.');if(s===1)return buildingView();if(s===2)return buildingView(true);if(s===3)return brief('건물 밖의 탄소배출을 찾아보세요','가상도시의 배출 부문을 살펴보고 건물의 에너지 수지로 설명할 수 없는 부분을 선택하세요.')+chart([{name:'기준 배출',points:Object.entries(BASE).map(([x,y])=>({x,y}))}],'tCO₂e/년 · 가상값',{bars:true})+`<div class="values">${Object.entries(BASE).map(([k,v])=>point('가상도시 '+k,v,'tCO₂e/년','기준 시나리오','수업용 가상 Carbon Budget','교육용 모형')).join('')}</div>`+field('l3carbon','에너지 수지가 0이어도 탄소배출이 남는 이유')+`<label class="field">검증 연습: 풍속 자료 없이 AI가 풍력을 추천했습니다.${select('literacy3',[['','선택'],['accept','채택'],['conditional','근거 추가 후 채택'],['reject','거부']],S.literacy3||'')}</label>`+field('l3decision','AI 추천을 그렇게 판단한 이유');return brief('내 도시의 초안을 작성하세요','앞 차시의 정책 전략과 건물 탐구 결과를 연결합니다.')+`<div class="note">2차시에서 가져온 전략: ${esc(S.answers.l2transfer||'아직 작성하지 않았습니다.')}</div>`+field('planProblem','해결할 문제와 핵심 데이터')+field('planEnergy','에너지 생산·공급 계획')+field('planBuilding','에너지 효율·건축 계획')+field('planTransport','교통 계획')+field('planWaste','폐기물·자원순환 계획')+field('planGreen','녹지·흡수 계획','탄소 흡수량을 근거 없이 수치로 약속하지 마세요.')+field('planConditions','기술 선택의 근거·필요 조건·예상 한계');}
 if(s===0)return brief('세 차시의 판단을 다시 읽으세요','도시계획에 사용할 근거가 충분한지 검토하세요. 수치가 없는 주장은 앞 차시로 돌아가 보완할 수 있습니다.')+`<div class="chips">${['l1claim','l2transfer','planProblem'].map((k,i)=>`<span class="chip">${i+1}차시 ${S.answers[k]?'기록 있음':'기록 필요'}</span>`).join('')}</div>`+evidenceList()+field('l4priority','최종 도시에서 우선할 문제와 근거');
 if(s===1)return budgetView();
 if(s===2)return brief('도시계획을 생성 조건으로 바꾸세요','계획에서 초안을 가져온 뒤 공간 배치와 필수조건을 직접 수정하세요.')+`<button id="build-prompt"><i data-lucide="file-input"></i> 계획으로 프롬프트 초안 만들기</button>`+field('cityPrompt','도시 전체 설계 프롬프트','환경 문제 + 데이터 근거 + 감축 목표 + 에너지 + 건축 + 교통 + 자원순환 + 녹지 + 공간 배치',10)+`<button id="prompt-check"><i data-lucide="list-checks"></i> 계획 항목 대조</button><div id="prompt-findings"></div>`+field('promptRevision','프롬프트에서 수정한 내용과 이유');
 if(s===3)return modelView();

function modelView(){return brief('계획을 도시 공간에 배치하세요','정책 객체의 위치를 선택하고, 생성 모델이 있다면 GLB를 가져와 계획과 대조하세요.')+`<div class="row"><button id="view-city"><i data-lucide="box"></i> 도시 둘러보기</button><button id="export-scene"><i data-lucide="download"></i> 도시 GLB 내보내기</button></div>`+POLICIES.filter(p=>S.policies[p.id]?.on).map(p=>`<label class="field">${p.name} 배치${select('place_'+p.id,[['north','북측 주거 구역'],['east','동측 에너지 구역'],['south','남측 생활 구역'],['west','서측 교통 구역']],S.placements[p.id]||'east')}</label>`).join('')+`<div class="band"><h3>AI 생성 모델 가져오기</h3><p class="small">현재 기본 도시는 선택한 정책을 나타내는 수업용 모형입니다. Meshy 생성 결과는 별도로 가져와 검증합니다.</p><label class="field">GLB 파일<input type="file" id="model-file" accept=".glb"></label><p id="model-state" class="small">${S.model?esc(S.model.name)+' · 저장된 모델':'가져온 AI 모델 없음'}</p><label class="field">가져온 모델의 회전<input type="range" id="model-rotation" min="0" max="360" value="${S.model?.rotation||0}"></label><button id="remove-model">가져온 모델 제거</button></div><details><summary>Meshy 생성 요청</summary>${field('assetPrompt','생성할 개별 객체 설명','800자 이내. 기술의 형태·필수 구조·비례·재료를 포함하세요.',4)}<div class="row"><button id="meshy-generate" ${!api.meshy?'disabled':''}>Meshy 초안 생성 · 크레딧 사용</button><a href="https://www.meshy.ai/" target="_blank" rel="noopener">Meshy 열기</a></div><p class="small">${api.meshy?'서버 연결됨 · 형태 초안(무텍스처) 생성':'서버 미연결 · 외부에서 생성한 GLB를 가져올 수 있습니다.'}</p><div id="meshy-status"></div></details>`+field('l4model','계획의 어떤 요소를 어떻게 표현했나요?','수업용 배치 모형과 AI 생성 모델을 구분해서 기록하세요.')}
function verifyView(){const req=POLICIES.filter(p=>S.policies[p.id]?.on);return brief('원래 근거와 결과를 대조하고 수정하세요','생성물의 누락·임의 추가·과학적 오류 또는 한계를 하나 이상 찾아 기록하세요.')+`<table class="mini-table matrix"><tr><th>필수 요소</th><th>프롬프트</th><th>3D 결과</th></tr>${req.map(p=>`<tr><td>${p.name}<br><small>${esc(S.policies[p.id].evidence)}</small></td>${['prompt','model'].map(k=>`<td><select data-matrix="${p.id}_${k}"><option value="">미확인</option>${['일치','누락','수정 필요'].map(v=>`<option ${S.checks[p.id+'_'+k]===v?'selected':''}>${v}</option>`).join('')}</select></td>`).join('')}</tr>`).join('')}</table>`+`<div class="note">${S.model?'AI 모델을 계획과 직접 대조하세요.':'현재 가져온 AI 생성 모델이 없습니다. 기본 배치 모형 검증은 가능하지만 AI 3D 결과 검증은 아직 완료할 수 없습니다.'}</div>`+field('l4error','발견한 오류·누락·한계','어느 요소가 어떤 근거와 어긋났는지 구체적으로 적으세요.')+field('l4fix','수정한 점과 남은 한계')+field('l4speech','발표 · 우리 도시를 데이터로 설명하기','핵심 근거 2개, 정책 선택, 예상 효과, 모형 한계를 포함하세요.',5)+`<div class="band"><h3>최종 자기점검</h3>${['데이터의 단위·연도·출처를 확인했다','에너지 수지와 탄소중립을 구분했다','정책 선택과 데이터 근거를 연결했다','생성 결과의 오류·한계를 확인하고 수정했다'].map((x,i)=>`<label class="choice"><input type="checkbox" data-review="${i}" ${S.checks['review'+i]?'checked':''}>${x}</label>`).join('')}</div><div class="row"><button id="final-report"><i data-lucide="file-check-2"></i> 최종 보고서</button><button id="export-all"><i data-lucide="download"></i> 탐구 기록 저장</button></div>`}
const QUESTIONS=[['두 연도의 수치를 읽었나요? 그 판단을 확인하려면 어떤 에너지 자료가 더 필요한가요?','전력 비율과 전체 에너지 비율의 분모는 같은가요? 새 자료로 처음 설명을 수정해 보세요.'],['주장에 사용한 변수는 무엇인가요? 반박할 수 있는 자료 한 종류를 더 찾아보세요.','이 도시와 다른 도시의 연도·산정 경계가 같나요? 정책 목표를 실제 성과로 읽지 않았나요?'],['발전량이 많은 한 시간으로 하루 전체를 판단할 수 있나요? 밤의 부족 전력도 더해보세요.','건물 밖에 남은 배출 부문은 무엇인가요? 선택한 기술의 적용 조건은 확인했나요?'],['선택한 정책은 어느 근거와 연결되나요? 근거 없는 객체를 추가하지 않았나요?','계획·프롬프트·3D 결과에서 같은 요소를 찾으세요. 누락이나 임의 추가를 무엇으로 확인했나요?']];
function renderCoach(){const l=S.lesson;if(S.mode==='comparison'){$('#coach').innerHTML=window.Research?.credential()?'<div class="coach-inline"><h3>'+LESSONS[l].role+'</h3><p>'+QUESTIONS[l][S.steps[l]>2?1:0]+'</p></div>':'';return}const q=QUESTIONS[l][S.steps[l]>2?1:0];$('#coach').innerHTML=`<div class="coach-inline"><div class="row"><h3>${LESSONS[l].role}</h3><span class="badge">${api.claude?'Claude 연결':'기본 탐구 질문 · AI 미연결'}</span></div><p>${q}</p><label class="field">나의 질문 또는 현재 설명<textarea id="coach-question" rows="2" maxlength="4000"></textarea></label><button id="ask-coach" class="coach-trigger" ${api.claude?'':'disabled'}><i data-lucide="message-circle"></i> Claude에게 근거 점검받기</button>${S.chat.filter(c=>c.lesson===l).slice(-2).map(c=>`<div class="evidence"><small>${esc(c.provider)} · ${esc(c.time)}</small><p>${esc(c.question)}</p><div class="coach-answer">${esc(c.text)}</div></div>`).join('')}</div>`;icons()}
function render(){selectedPoints=[];const l=S.lesson,s=S.steps[l],lesson=LESSONS[l];$('#lessons').innerHTML=LESSONS.map((v,i)=>`<button class="lesson-tab ${i===l?'active':''}" data-lesson="${i}" aria-current="${i===l?'step':'false'}"><b>0${i+1}</b><span>${v.short}${S.done[i]?' ✓':''}</span></button>`).join('');$('#steps').innerHTML=lesson.steps.map((x,i)=>`<button class="step ${s===i?'active':''}" data-step="${i}">${i+1}. ${x}</button>`).join('');$('#mission-kicker').textContent=`${l+1}차시 · ${lesson.tag.split(' / ')[1]} · ${lesson.mins[s]}분`;$('#mission-title').textContent=lesson.title;$('#deliverable').textContent='남길 기록: '+lesson.output;$('#world-kicker').textContent=lesson.tag;$('#world-title').textContent=lesson.place;$('#world-description').textContent=lesson.question;$('#content').innerHTML=getContent(l,s);$('#feedback').textContent='';$('#previous').disabled=l===0&&s===0;$('#next').innerHTML=s<4?'다음 탐구 <i data-lucide="arrow-right"></i>':l<3?'기록 확인 · 다음 차시 <i data-lucide="arrow-right"></i>':'프로젝트 완료 <i data-lucide="check"></i>';$('#step-status').textContent=`${s+1} / 5 단계 · 근거 ${S.evidence.filter(e=>e.lesson===l+1).length}개`;renderCoach();icons();updateTimer();if(scene)buildScene();save()}
function go(l,s){if(!canVisitLesson(l)){toast('현재 차시의 탐구 기록을 마치면 다음 구역이 열립니다.');return}S.lesson=l;S.steps[l]=s;log('navigate',{destination:[l,s]});render();$('#scroll').scrollTop=0}
function validFinal(l){let required=[['l1claim','l1evidence','l1reason','l1revision'],['l2problem','l2evidence','l2policy','l2effect','l2limit','l2transfer'],['planProblem','planEnergy','planBuilding','planTransport','planWaste','planGreen','planConditions'],['l4priority','l4tradeoff','cityPrompt','promptRevision','l4model','l4error','l4fix','l4speech']][l];let missing=required.find(k=>!S.answers[k]?.trim());if(missing)return {message:'아직 작성하지 않은 기록이 있습니다. 표시된 칸을 완성하세요.',key:missing};if(l<2&&S.evidence.filter(e=>e.lesson===l+1&&e.kind==='실제 자료').length<2)return {message:'이 차시의 실제 수치 근거를 2개 이상 담으세요.'};if(l===0&&(S.answers.l1evidence.match(/\d+(?:[.,]\d+)*/g)||[]).length<2)return {message:'근거 문장에 실제 수치 2개 이상을 포함하세요.',key:'l1evidence'};if(l===3){let ps=POLICIES.filter(p=>S.policies[p.id]?.on);if(!ps.length)return {message:'탄소 설계에서 정책을 선택하세요.'};if(budget().cost>8)return {message:'탄소 설계의 자원 제약 8점을 초과했습니다.'};if(ps.some(p=>!S.policies[p.id].evidence||!S.policies[p.id].reason?.trim()))return {message:'모든 정책에 근거와 적용 이유를 연결하세요.'};if(S.scenarios.length<2)return {message:'탄소 설계에서 서로 다른 정책 조합 2개를 비교·기록하세요.'};if(!S.model)return {message:'원문 최종 산출물에는 AI 3D 결과 검증이 포함됩니다. 도시 구현에서 생성한 GLB를 가져오세요. 현재까지 기록은 보고서로 저장할 수 있습니다.'};if(ps.some(p=>!S.checks[p.id+'_prompt']||!S.checks[p.id+'_model']))return {message:'계획–프롬프트–3D 대조표를 모두 확인하세요.'};if([0,1,2,3].some(i=>!S.checks['review'+i]))return {message:'최종 자기점검을 완료하세요.'};}return null}
function next(){const l=S.lesson,s=S.steps[l];if(s<4){go(l,s+1);return}const err=validFinal(l);if(err){$('#feedback').textContent=err.message;const el=err.key?$(`[data-answer="${err.key}"]`):$('#feedback');el?.scrollIntoView({block:'center'});el?.focus();return}S.done[l]=true;log('lesson_completed');if(l<3)go(l+1,0);else{toast('4차시 프로젝트 기록이 완성되었습니다.');showReport()}}

  camera.position.set(fx+Math.sin(camAngle)*orbitRadius,camHeight+1.15,fz+Math.cos(camAngle)*orbitRadius);camera.lookAt(fx,1.15,fz);return;
 }
 const focusX=archiveRoom?player.position.x*(innerWidth<700?1:.5):player.position.x,focusZ=archiveRoom?player.position.z*.35:player.position.z;
 camera.position.set(focusX+Math.sin(camAngle)*orbitRadius,camHeight+.4,focusZ+Math.cos(camAngle)*orbitRadius);camera.lookAt(focusX,.4,focusZ);
}
function resetOutdoorCamera(){overviewPitch=Math.atan(.7);camAngle=.04;camRadius=innerWidth<700?32:52;camHeight=camRadius*.7}
function initRPG(){
 document.body.classList.add('rpg');resetOutdoorCamera();
 styleCozyPlayer();player.rotation.y=Math.PI;if(S.lesson===0&&!archiveRoom)placeVillageSpawn();initFirstPersonHands();initObjectiveMarker();
 $('.world-tools').insertAdjacentHTML('afterbegin','<div class="camera-modes" role="group" aria-label="플레이 시점"><button class="icon" id="camera-third" data-camera-mode="third" aria-pressed="true" title="전체 보기" aria-label="전체 보기"><i data-lucide="orbit"></i></button><button class="icon" id="camera-follow" data-camera-mode="follow" aria-pressed="false" title="따라가기 시점" aria-label="따라가기 시점"><i data-lucide="footprints"></i></button><button class="icon" id="camera-first" data-camera-mode="first" aria-pressed="false" title="1인칭 시점" aria-label="1인칭 시점"><i data-lucide="eye"></i></button></div>');
 $('.world').insertAdjacentHTML('beforeend','<span class="view-reticle" aria-hidden="true"><i data-lucide="plus"></i></span>');
 $$('[data-camera-mode]').forEach(b=>b.addEventListener('click',()=>setCameraMode(b.dataset.cameraMode)));
 $('#camera-home').addEventListener('click',e=>{if(rpgBlocked())return;if(cameraMode==='first'){viewYaw=0;viewPitch=0;drag=null;pressed.clear();rpgWalk=null;$('#world-canvas').focus();e.stopPropagation()}else if(cameraMode==='follow'){followYaw=player.rotation.y-Math.PI;followPitch=.24;followDistance=4.8;followReady=false;e.stopPropagation()}else if(!archiveRoom){resetOutdoorCamera();e.stopPropagation()}});
 for(const [id,amount]of[['camera-in',-.6],['camera-out',.6]])$('#'+id).addEventListener('click',e=>{e.stopPropagation();if(rpgBlocked())return;if(cameraMode==='follow')followDistance=Math.max(2.7,Math.min(6.8,followDistance+amount));else if(cameraMode==='third')camRadius=Math.max(archiveRoom?14:22,Math.min(archiveRoom?30:90,camRadius+amount*8))});
 $('.pad').addEventListener('pointerdown',()=>{rpgWalk=null});
 $('.world').insertAdjacentHTML('beforeend','<aside class="quest-hud"><small>현재 임무</small><p id="quest-text"></p><span class="quest-tools"><button id="bag-open" hidden title="에코의 탐사 가방" aria-label="에코의 탐사 가방 · 예비 에너지볼 1개"><img src="assets/story/energy-ball-160.webp" alt="" width="22" height="22"></button><button id="story-replay" hidden title="이야기 다시 보기" aria-label="이야기 다시 보기"><i data-lucide="book-open"></i></button></span></aside><div class="rpg-route"><button class="icon" id="rpg-find-npc" title="연구원에게 이동" aria-label="연구원에게 이동"><i data-lucide="message-circle"></i></button><button class="icon" id="rpg-find-portal" title="포탈로 이동" aria-label="포탈로 이동"><i data-lucide="map-pin"></i></button><button class="icon" id="rpg-find-exhibit" title="현재 임무의 전시물로 이동" aria-label="현재 임무의 전시물로 이동"><i data-lucide="landmark"></i></button><button class="icon" id="rpg-find-exit" title="기록관 출구로 이동" aria-label="기록관 출구로 이동"><i data-lucide="door-open"></i></button></div><button class="rpg-interact primary" id="rpg-interact" hidden></button>');
 $('.workspace').insertAdjacentHTML('afterbegin','<button class="icon" id="activity-close" title="도시로 돌아가기" aria-label="도시로 돌아가기"><i data-lucide="x"></i></button>');
 document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.region!==undefined)return travelRegion(+b.dataset.region);switch(b.id){case'activity-close':closeActivity();break;case'rpg-interact':rpgInteract();break;case'rpg-find-npc':routeTo(rpgTargets.find(t=>t.kind==='npc'));break;case'rpg-find-portal':routeTo(rpgTargets.find(t=>t.kind==='portal'&&t.x>0));break;case'rpg-find-exhibit':routeTo(rpgTargets.find(t=>t.kind===(archiveRoom?'exhibit':'station')&&t.step===S.steps[0]));break;case'rpg-find-exit':routeTo(rpgTargets.find(t=>t.kind==='exit'));break;case'rpg-accept':{const accepted=questState()[S.lesson];questState()[S.lesson]=true;log('quest_accepted');$('#modal').close();rpgHud();if(cruiseEnabled()){cruiseNext();break}if(accepted){if(S.lesson===0)routeTo(rpgTargets.find(t=>t.kind===(archiveRoom?'exhibit':'station')&&t.step===S.steps[0]));else openActivity(S.steps[S.lesson])}else toast('임무 수락 · 탐구 시설을 선택하세요.');break}case'rpg-npc-leave':$('#modal').close();$('#world-canvas').focus();break;case'camera-home':if(archiveRoom){camAngle=0;camRadius=21;camHeight=22;overviewPitch=Math.atan(18/19)}break;case'world-open':case'view-house':case'view-city':closeActivity();break}});
 window.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('activity-open')&&!document.querySelector('dialog[open]'))closeActivity();if(e.key.toLowerCase()==='e'&&!e.repeat&&(e.target===$('#world-canvas')||e.target===$('#rpg-interact'))&&!rpgBlocked()){e.preventDefault();rpgInteract()}if(document.body.classList.contains('activity-open')&&e.key==='Tab'){const els=Array.from($('.workspace').querySelectorAll('button:not([disabled]),textarea,select,input,a[href]')).filter(x=>x.getClientRects().length);const first=els[0],last=els[els.length-1];if(e.shiftKey&&e.target===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&e.target===last){e.preventDefault();first.focus()}}});
 $('#modal').addEventListener('close',()=>{if(!document.body.classList.contains('activity-open'))$('#world-canvas').focus()});
 rpgReady=true;rpgHud();initCruise();initNavigation();icons();resizeScene();$('#world-canvas').focus();
}
window.addEventListener('beforeunload',()=>{const t=document.activeElement;if(t?.dataset.answer)answer(t.dataset.answer,t.value);save()});boot();
</script></body></html>
