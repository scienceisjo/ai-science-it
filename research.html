<!doctype html><html lang="ko"><head><meta name="netzero-hosting" content="static"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>NET ZERO · 연구 운영</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f8;color:#203332;font:15px/1.65 system-ui,'Malgun Gothic',sans-serif;letter-spacing:0}header{padding:18px 24px;background:#fff;border-bottom:1px solid #d8e1df;display:flex;justify-content:space-between;align-items:center;gap:12px}header b{display:block}header small{color:#687978}main{max-width:1120px;margin:auto;padding:24px}h1{font-size:25px}h2{font-size:20px}h3{font-size:16px}h1,h2,h3{margin:0 0 12px}p{margin:8px 0 16px}a{color:#176559}button,input,select,textarea{font:inherit}button{padding:8px 13px;border:1px solid #b6c9c2;border-radius:5px;background:white;color:#1a5044;cursor:pointer;min-height:40px}button.primary{background:#196756;color:white}button:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{padding:9px;border:1px solid #b7c9c4;border-radius:4px;background:#fff;max-width:100%}textarea{width:100%;min-height:100px;resize:vertical}label{display:block;margin:12px 0}label input:not([type=checkbox]),label select{display:block;width:100%;margin-top:4px}section{padding:24px 0;border-bottom:1px solid #d7e0dd}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}.note{padding:12px 15px;background:#fff5d8;border-left:3px solid #b7892f;margin:12px 0;font-size:13px}.muted,small{color:#647774}.error{color:#a52b22;white-space:pre-wrap}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;background:white;font-size:13px}td,th{text-align:left;padding:10px;border-bottom:1px solid #dbe3df;vertical-align:top}th{background:#e8f0ed}.answer{white-space:pre-wrap;background:white;padding:12px;border-left:3px solid #76a899}.pill{padding:3px 7px;border-radius:3px;background:#e2ece8;font-size:12px}.score select{width:100px}.score small{display:block;margin-bottom:8px}.tools{display:flex;gap:8px;flex-wrap:wrap}.warn{color:#9e5521}#status{font-size:12px;color:#4b6660}footer{padding:30px 0;font-size:11px;color:#637770}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #c7952c;outline-offset:2px}@media(max-width:650px){header{padding:12px;align-items:flex-start}header b{font-size:14px}header small{font-size:10px}main{padding:16px}.grid{grid-template-columns:1fr;gap:0}th,td{padding:8px}.tools{max-width:180px}h1{font-size:22px}}
</style></head><body><header><div><b>NET ZERO · 연구 운영</b><small>AI와과학을IT다 · 로컬 파일럿</small></div><div class="tools"><a href="./">도시로</a><button id="refresh" title="새로고침">새로고침</button><button id="logout" hidden>로그아웃</button></div></header><main><div id="status" role="status"></div><p id="error" class="error" role="alert"></p><div id="view"></div><footer id="app-credit">© 2026 조승재(과학이조선생) · 해누리중학교 · 2026-09-26<br>검사 초안 v1 · 타당화된 표준화 검사가 아닙니다.</footer></main>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const staticHosting=document.querySelector('meta[name="netzero-hosting"]')?.content==='static';
let role=sessionStorage.getItem('researchRole'),token=sessionStorage.getItem('researchToken'),classes=[],detail=null,test=null,issued=null;
const phases={pre:'사전 검사',learning:'수업 진행',post:'사후 검사',closed:'종료'};
async function api(route,data){const r=await fetch('/api/research/'+route,{method:data?'POST':'GET',headers:{'Content-Type':'application/json','x-research-token':token||''},...(data?{body:JSON.stringify(data)}:{})});const d=await r.json();if(!r.ok){if(r.status===401&&token){sessionStorage.removeItem('researchToken');sessionStorage.removeItem('researchRole');token=null;role=null}throw Error(d.error)}return d}
function session(d,r){token=d.token;role=r;sessionStorage.setItem('researchToken',token);sessionStorage.setItem('researchRole',r)}
function download(name,data,type){const u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
const csv=rows=>'\ufeff'+rows.map(row=>row.map(x=>'"'+String(x??'').replace(/^[=+@\-\t\r]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n');
const total=s=>s?.values?.reduce((a,b)=>a+b,0)??'';
async function home(){ if(staticHosting){$('#logout').hidden=true;document.querySelector('header small').textContent='AI와과학을IT다 · 공개 체험판';$('#status').textContent='학급 서버 미연결';$('#view').innerHTML='<h1>연구 운영 안내</h1><p>이 공개본의 탐구 기록은 현재 기기의 브라우저에만 저장됩니다. 탐구 기록에서 JSON 파일로 내보낼 수 있습니다.</p><div class="note">학급별 기록 수집, 사전·사후 검사, 실험·비교집단 통제, 실시간 AI 코치는 별도 인증 서버가 필요합니다. 이 사이트에서는 참여 코드나 개인정보를 입력받지 않습니다.</div><p><a href="./">NET ZERO ECO-CITY로 돌아가기</a></p>';return}$('#error').textContent='';$('#logout').hidden=!token;if(!token){const d=await api('status');$('#view').innerHTML='<h1>연구 참여 및 운영</h1><div class="note">로컬 파일럿입니다. 실명·학번은 입력하지 마세요. 검사 문항·동의 절차·보관 계획을 검토한 뒤 연구에 사용하세요.</div><div class="grid"><section><h2>학생 참여</h2><form id="join"><label>학급 코드<input name="classCode" required autocomplete="off"></label><label>개인 참여 코드<input name="code" required autocomplete="off"></label><button class="primary">참여하기</button></form></section><section><h2>교사 '+(d.setupRequired?'최초 설정':'로그인')+'</h2><form id="teacher-login" data-setup="'+d.setupRequired+'"><label>교사 암호<input type="password" name="password" minlength="12" maxlength="200" required autocomplete="current-password"></label>'+(d.setupRequired?'<label>암호 확인<input type="password" name="confirm" minlength="12" required autocomplete="new-password"></label><p class="muted">12자 이상. 이 컴퓨터의 첫 교사 계정을 만듭니다.</p>':'')+'<button class="primary">'+(d.setupRequired?'교사 계정 만들기':'로그인')+'</button></form></section></div>';return}if(role==='teacher')await dashboard();else await student()}
async function dashboard(){const d=await api('classes');classes=d.classes;$('#view').innerHTML='<h1>학급 연구 현황</h1><p class="muted">집단 배정과 자료 버전은 생성 후 고정됩니다. 검사는 두 집단에 동일한 A/B 문항을 교차 배정합니다.</p><details><summary>새 학급 만들기</summary><form id="create"><div class="grid"><label>학급 별칭<input name="name" maxlength="60" required placeholder="예: 파일럿 A"></label><label>인원<input type="number" name="count" min="1" max="60" value="24" required></label></div><label>학급 조건<select name="mode"><option value="comparison">비교집단 · 적응형 AI 없음</option><option value="guided">실험집단 · 적응형 AI 코치</option></select></label><label><input type="checkbox" name="reviewed" required> 검사 초안, 참여 안내·동의 및 보관 계획을 검토했습니다.</label><p class="muted">이 확인은 실제 동의서를 대신하지 않습니다. 학급 수준 배정은 무작위 배정이 아닙니다.</p><button class="primary">학급 생성</button></form></details>'+classes.map(c=>'<section><div class="row"><h2>'+esc(c.name)+'</h2><span class="pill">'+(c.mode==='guided'?'실험집단':'비교집단')+'</span><span class="pill">'+phases[c.phase]+'</span></div><p>학급 코드 <b>'+esc(c.code)+'</b> · '+c.participants.length+'명 · 자료 '+c.dataVersion.slice(0,12)+'</p><div class="row"><button data-export="'+c.id+'">연구 JSON</button><button data-csv="'+c.id+'">점수 CSV</button></div>'+(c.phase!=='closed'?'<form class="phase-form" data-id="'+c.id+'"><div class="row"><input name="reason" required maxlength="500" placeholder="단계 전환 사유" aria-label="단계 전환 사유"><label><input type="checkbox" name="confirmMissing"> 미제출자 확인</label><button>다음 단계: '+phases[['pre','learning','post','closed'][['pre','learning','post','closed'].indexOf(c.phase)+1]]+'</button></div></form>':'')+'<div class="table-wrap"><table><tr><th>참여자</th><th>문항 순서</th><th>사전/사후</th><th>사전/사후 점수</th><th>수업 완료</th><th>서버 AI 응답</th><th>최종 수집</th><th></th></tr>'+c.participants.map(p=>'<tr><td>'+esc(p.alias)+(p.withdrawn?' · 중단':'')+'</td><td>'+p.sequence+'</td><td>'+(p.pre?'제출':'미제출')+' / '+(p.post?'제출':'미제출')+'</td><td>'+total(p.scores.pre)+' / '+total(p.scores.post)+'</td><td>'+p.done.filter(Boolean).length+'/4</td><td>'+p.aiCalls+'</td><td>'+esc(p.updated?new Date(p.updated).toLocaleString('ko-KR'):'없음')+'</td><td><button data-detail="'+p.id+'">응답·채점</button></td></tr>').join('')+'</table></div></section>').join('');const status=await fetch('/api/status').then(r=>r.json());$('#status').textContent=status.claude?'Claude 연결 설정 있음 · 실제 응답 성공 횟수를 별도 확인하세요.':'Claude 미연결 · 실험집단으로 배정해도 실제 AI 처치는 제공되지 않습니다.'}
function issuance(d){issued=d;$('#view').innerHTML='<h1>참여 코드 발급</h1><div class="note">개인 코드는 지금 한 번만 표시됩니다. 내려받아 학생별로 따로 전달하세요. 코드는 비밀번호와 같이 취급하세요.</div><p>학급 코드: <b>'+esc(d.class.code)+'</b></p><div class="row"><button id="issued-download" class="primary">참여 코드 CSV 저장</button><button id="back">학급 현황</button></div><div class="table-wrap"><table><tr><th>별칭</th><th>개인 코드</th><th>문항 순서</th></tr>'+d.issued.map(p=>'<tr><td>'+p.alias+'</td><td>'+p.code+'</td><td>'+p.sequence+'</td></tr>').join('')+'</table></div>'}
async function student(){const m=await api('me');$('#status').textContent=m.className+' · '+m.participant.alias;$('#view').innerHTML='<h1>'+phases[m.phase]+'</h1>'+(m.phase==='learning'?'<p>탐구 기록은 이 학급의 개인 기록으로 수집됩니다.</p><a href="./?study=1">도시 입장</a>':m.phase==='closed'?'<p>학급 연구가 종료되었습니다.</p>':'<button id="test-start" class="primary">검사 열기</button>')+'<p class="muted">개인 코드는 다른 사람과 공유하지 마세요. 종료할 때 로그아웃하세요.</p>'}
async function showTest(){test=await api('test');const t=test,f=t.form;$('#view').innerHTML='<h1>'+phases[t.phase]+' · 자료 해석</h1><p class="muted">수행문항 초안 '+esc(t.form.id)+' · 교육용 가상 데이터 · 총배출 천 tCO₂e/년, 인구 천 명</p><table><tr><th>연도</th><th>A도시 총배출</th><th>B도시 총배출</th></tr>'+f.years.map((y,i)=>'<tr><td>'+y+'</td><td>'+f.a[i]+'</td><td>'+f.b[i]+'</td></tr>').join('')+'</table><p>마지막 연도 인구: A도시 '+f.pop[0]+'천 명, B도시 '+f.pop[1]+'천 명.</p>'+(t.submitted?'<div class="note">제출되었습니다. 제출한 응답은 변경할 수 없습니다.</div><button id="back">참여 현황</button>':'<form id="assessment">'+t.questions.slice(0,5).map((q,i)=>'<label>'+(i+1)+'. '+esc(q)+(t.initialAt?'<div class="answer">'+esc(t.answers[i])+'</div>':'<textarea name="q'+i+'" maxlength="5000" required>'+esc(t.answers[i]||'')+'</textarea>')+'</label>').join('')+(t.initialAt?'<div class="note"><b>추가 자료</b><br>'+esc(f.extra)+'</div><label>6. '+esc(t.questions[5])+'<textarea name="q5" maxlength="5000" required>'+esc(t.finalDraft)+'</textarea></label><div class="row"><button type="button" id="revision-draft">임시 저장</button><button class="primary">최종 제출</button></div>':'<div class="row"><button type="button" id="test-draft">임시 저장</button><button class="primary">최초 판단 확정 · 추가 자료 확인</button></div><p class="muted">확정 후 1~5번은 수정할 수 없습니다. 새 자료에 대한 판단은 6번에 적습니다.</p>')+'</form>')}
async function showDetail(id){detail=await api('detail',{id});const p=detail;$('#view').innerHTML='<div class="row"><h1>'+esc(p.alias)+' · 응답과 채점</h1><button id="back">학급 현황</button></div><p class="muted">집단 조건을 숨긴 채 응답을 검토합니다. 점수는 자동 산출하지 않습니다. 각 영역 0~3점, 총 18점.</p>'+['pre','post'].map(phase=>{const t=p.tests[phase];return '<section><h2>'+phases[phase]+'</h2>'+(!t?'<p>시작 전</p>':t.answers.map((a,i)=>'<h3>'+(i+1)+'. 응답</h3><div class="answer">'+esc(a)+'</div>').join('')+(t.submitted?'<form class="score" data-phase="'+phase+'">'+p.rubrics[phase].map((r,i)=>'<label>영역 '+(i+1)+'<small>'+esc(r)+'</small><select name="s'+i+'" required><option value="">미채점</option>'+[0,1,2,3].map(n=>'<option '+(p.scores[phase]?.values[i]===n?'selected':'')+'>'+n+'</option>').join('')+'</select></label>').join('')+'<label>채점 근거 / 변경 사유<textarea name="note" maxlength="2000" required>'+esc(p.scores[phase]?.note||'')+'</textarea></label><button class="primary">채점 저장</button></form>':'<p>최종 제출 전 · 채점 불가</p>'))+'</section>'}).join('')+'<section><h2>수집된 탐구 기록</h2><p>근거 '+(p.snapshot?.evidence?.length||0)+'개 · 수정 이력 '+(p.snapshot?.revisions?.length||0)+'건 · 서버 AI 응답 '+p.aiCalls+'회</p><details><summary>탐구 답변</summary>'+Object.entries(p.snapshot?.answers||{}).map(([k,v])=>'<h3>'+esc(k)+'</h3><div class="answer">'+esc(v)+'</div>').join('')+'</details><p class="muted">클릭 수·문장 길이·AI 횟수는 학습 성과 점수가 아닙니다.</p></section><section><h2>참여 중단</h2><form id="withdraw"><label>중단 사유<input name="reason" required maxlength="500"></label><button '+(p.withdrawn?'disabled':'')+'>접근 중단</button></form><p class="muted">중단은 기록 삭제가 아닙니다. 기존 자료는 보관 계획에 따라 별도 관리하세요.</p></section>'}
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,b=f.querySelector('button[type=submit],button:not([type])'),v=Object.fromEntries(new FormData(f));if(b)b.disabled=true;$('#error').textContent='';try{
 if(f.id==='teacher-login'){if(f.dataset.setup==='true'&&v.password!==v.confirm)throw Error('암호 확인이 일치하지 않습니다.');session(await api(f.dataset.setup==='true'?'setup':'login',{password:v.password}),'teacher');await home()}
 if(f.id==='join'){session(await api('join',v),'student');await home()}
 if(f.id==='create'){const d=await api('classes',{name:v.name,count:+v.count,mode:v.mode,reviewed:v.reviewed==='on'});issuance(d)}
 if(f.classList.contains('phase-form')){const c=classes.find(x=>x.id===f.dataset.id),phase=['pre','learning','post','closed'][['pre','learning','post','closed'].indexOf(c.phase)+1];if(!confirm('단계를 전환하면 이전 단계로 돌아갈 수 없습니다. 계속할까요?'))return;await api('phase',{classId:c.id,phase,reason:v.reason,confirmMissing:v.confirmMissing==='on'});await dashboard()}
 if(f.id==='assessment'){if(!confirm(test.initialAt?'최종 제출할까요?':'최초 응답을 확정할까요? 이후 수정할 수 없습니다.'))return;await api('test/save',test.initialAt?{phase:test.phase,action:'final',answer:v.q5}:{phase:test.phase,action:'initial',answers:[0,1,2,3,4].map(i=>v['q'+i])});await showTest()}
 if(f.classList.contains('score')){await api('score',{id:detail.id,phase:f.dataset.phase,scores:[0,1,2,3,4,5].map(i=>+v['s'+i]),note:v.note});$('#status').textContent='채점을 저장했습니다.';await showDetail(detail.id)}
 if(f.id==='withdraw'){if(!confirm('이 참여자의 접근을 중단할까요?'))return;await api('withdraw',{id:detail.id,reason:v.reason});await showDetail(detail.id)}
 }catch(err){$('#error').textContent=err.message}finally{if(b)b.disabled=false}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||b.closest('form')&&b.type==='submit')return;try{
 if(b.id==='logout'){try{await api('logout',{})}finally{sessionStorage.removeItem('researchToken');sessionStorage.removeItem('researchRole');token=null;role=null;await home()}}
 if(['refresh','back'].includes(b.id))await home();if(b.id==='test-start')await showTest();
 if(b.id==='issued-download')download('participant-codes.csv',csv([['class','alias','personal_code','sequence'],...issued.issued.map(p=>[issued.class.code,p.alias,p.code,p.sequence])]),'text/csv');
 if(b.id==='test-draft'){const v=Object.fromEntries(new FormData($('#assessment')));await api('test/save',{phase:test.phase,action:'draft',answers:[0,1,2,3,4].map(i=>v['q'+i]||'')});$('#status').textContent='검사 임시 저장 완료';}
 if(b.id==='revision-draft'){await api('test/save',{phase:test.phase,action:'revision-draft',answer:document.querySelector('[name="q5"]').value});$('#status').textContent='수정 응답 임시 저장 완료';}
 if(b.dataset.detail)await showDetail(b.dataset.detail);
 if(b.dataset.export||b.dataset.csv){const d=await api('export',{classId:b.dataset.export||b.dataset.csv});if(b.dataset.export)download('study-records.json',JSON.stringify(d,null,2),'application/json');else download('study-scores.csv',csv([['class','alias','group','sequence','withdrawn','pre','post','difference','ai_responses','data_version'],...d.participants.map(p=>{const a=total(p.scores.pre),z=total(p.scores.post);return[d.class.name,p.alias,d.class.mode,p.sequence,!!p.withdrawn,a,z,a!==''&&z!==''?z-a:'',p.aiCalls||0,d.class.dataVersion]})]),'text/csv')}
 }catch(err){$('#error').textContent=err.message}});
home().catch(e=>$('#error').textContent=e.message);
</script></body></html>
